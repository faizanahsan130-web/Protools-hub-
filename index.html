<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTools - Free Online Utility Hub</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- QR Code Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <h1>ProTools Hub</h1>
        <p>Fast, secure, and free online utility tools for everyday tasks.</p>
    </header>

    <!-- Main Container -->
    <main class="container">
        
        <!-- 1. Password Generator Card -->
        <div class="card">
            <h2>Password Generator</h2>
            <div class="output-box">
                <span id="passwordDisplay">Click Generate</span>
            </div>
            <button class="btn primary-btn" onclick="generatePassword()">Generate Password</button>
        </div>

        <!-- 2. QR Code Generator Card -->
        <div class="card">
            <h2>QR Code Generator</h2>
            <input type="text" id="qrText" placeholder="Enter text or URL...">
            <button class="btn primary-btn" onclick="generateQRCode()">Generate QR</button>
            <div id="qrcode" class="qr-output"></div>
        </div>

        <!-- 3. Text Converter Card -->
        <div class="card">
            <h2>Text Converter</h2>
            <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
            <div class="btn-group">
                <button class="btn uppercase-btn" onclick="convertToUpperCase()">UPPERCASE</button>
                <button class="btn lowercase-btn" onclick="convertToLowerCase()">lowercase</button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 ProTools Hub. Built for creators & developers.</p>
    </footer>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
